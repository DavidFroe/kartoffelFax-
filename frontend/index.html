<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KartoffelFax</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <!-- Tailwind Play CDN for prototyping; replace with a built/purged CSS bundle before release -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-neutral-100 text-neutral-900 antialiased">
  <div class="flex h-screen flex-col">
    <!-- Toolbar -->
    <header class="flex items-center gap-3 border-b border-neutral-300 bg-white px-4 py-2">
      <span class="text-lg font-semibold tracking-tight">🥔 KartoffelFax</span>
      <button id="btn-new-fax" class="ml-4 rounded bg-amber-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-amber-700">
        Neues Fax
      </button>
      <span id="connection-status" class="ml-auto flex items-center gap-2 text-sm text-neutral-500">
        <span class="h-2 w-2 rounded-full bg-neutral-400" id="connection-dot"></span>
        <span id="connection-label">Nicht verbunden</span>
      </span>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- Column 1: Folders -->
      <nav class="w-56 shrink-0 overflow-y-auto border-r border-neutral-300 bg-white p-2" id="folder-list">
        <ul class="space-y-1 text-sm">
          <li><button data-folder="inbox" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">📥 Posteingang</button></li>
          <li><button data-folder="outbox" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">📤 Postausgang</button></li>
          <li><button data-folder="drafts" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">📝 Entwürfe</button></li>
          <li><button data-folder="archive" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">🗄️ Archiv</button></li>
        </ul>
        <hr class="my-3 border-neutral-200" />
        <ul class="space-y-1 text-sm">
          <li><button data-view="contacts" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">📇 Kontakte</button></li>
          <li><button data-view="settings" class="folder-item w-full rounded px-3 py-2 text-left hover:bg-amber-50">⚙️ Einstellungen</button></li>
        </ul>
      </nav>

      <!-- Column 2: Message list -->
      <section class="w-96 shrink-0 overflow-y-auto border-r border-neutral-300 bg-white" id="message-list">
        <p class="p-4 text-sm text-neutral-400">Keine Faxe geladen.</p>
      </section>

      <!-- Column 3: Preview / Detail -->
      <main class="flex-1 overflow-y-auto bg-neutral-50 p-6" id="detail-view">
        <div class="flex h-full items-center justify-center text-neutral-400">
          <p>Wähle ein Fax aus, um die Vorschau anzuzeigen.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
